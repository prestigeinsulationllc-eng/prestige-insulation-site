<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 60" fill="none">
  <defs>
    <style>
      @font-face {
        font-family: 'PlayfairLogo';
        src: url(data:font/woff2;base64,) format('woff2');
        font-weight: 700;
      }
    </style>
  </defs>

  <!-- Gold rounded square mark -->
  <rect width="60" height="60" rx="10" fill="#c9a04c"/>

  <!-- Black P inside mark -->
  <text x="30" y="31"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="42" font-weight="900"
    fill="#000000">P</text>

  <!-- Prestige Insulation — now correctly using embedded Playfair Display -->
  <text x="78" y="30"
    dominant-baseline="middle"
    font-family="PlayfairLogo, Georgia, 'Times New Roman', serif"
    font-size="28" font-weight="700"
    letter-spacing="-0.4"
    fill="#080807">Prestige Insulation</text>

</svg>
