<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 60" fill="none">

  <!-- Gold rounded square mark -->
  <rect width="60" height="60" rx="10" fill="#c9a04c"/>

  <!-- Black P inside mark -->
  <text x="30" y="31"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="38" font-weight="900"
    fill="#080807">P</text>

  <!-- Prestige Insulation — single bold line -->
  <text x="78" y="30"
    dominant-baseline="middle"
    font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
    font-size="27" font-weight="700"
    fill="#080807">Prestige Insulation</text>

</svg>
