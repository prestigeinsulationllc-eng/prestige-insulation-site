<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 60" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c878"/>
      <stop offset="55%" stop-color="#c9a04c"/>
      <stop offset="100%" stop-color="#a3792e"/>
    </linearGradient>
    <style>
      @font-face {
        font-family: 'MontserratIcon';
        src: url(data:font/woff2;base64,) format('woff2');
        font-weight: 800;
      }
      @font-face {
        font-family: 'PlayfairLogo';
        src: url(data:font/woff2;base64,) format('woff2');
        font-weight: 700;
      }
    </style>
  </defs>

  <!-- Gold rounded square mark -->
  <rect width="60" height="60" rx="10" fill="url(#goldGrad)"/>

  <!-- Black P inside mark -->
  <g transform="translate(30,32) scale(1,1.22) translate(-30,-32)">
  <text x="30" y="32"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="MontserratIcon, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="34" font-weight="800"
    fill="#000000">P</text>
  </g>

  <!-- Prestige Insulation — now correctly using embedded Playfair Display -->
  <text x="78" y="30"
    dominant-baseline="middle"
    font-family="PlayfairLogo, Georgia, 'Times New Roman', serif"
    font-size="28" font-weight="700"
    letter-spacing="-0.4"
    fill="#080807">Prestige Insulation</text>

</svg>
